services:
  api:
    build: .
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    env_file: .env
    environment:
      CONVICTION_DATA_DIR: /data
    volumes:
      - ${DATA_HOST_DIR:-./data}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-2
        awslogs-group: conviction
        awslogs-stream: api

  app:
    build: .
    env_file: .env
    environment:
      CONVICTION_DATA_DIR: /data
      API_URL: http://api:8000
    volumes:
      - ${DATA_HOST_DIR:-./data}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-2
        awslogs-group: conviction
        awslogs-stream: app

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - api
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-2
        awslogs-group: conviction
        awslogs-stream: caddy

volumes:
  caddy_data:
  caddy_config:
