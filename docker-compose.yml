services:
  app:
    build: .
    env_file: .env
    environment:
      CONVICTION_DATA_DIR: /data
    volumes:
      - ${DATA_HOST_DIR:-./data}:/data
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: conviction
        awslogs-stream: app

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: conviction
        awslogs-stream: caddy

volumes:
  caddy_data:
  caddy_config:
